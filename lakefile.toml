name = "oka"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Oka"]

# `lake lint` runs the environment linters over the `Oka` library.
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Oka"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Oka"

# The modular `j`-function with its fibres, and the lattice uniformisation of Weierstrass curves
# over `ℂ`: used by `Oka/Uniformization/` (uniformisation of once-punctured elliptic curves).
[[require]]
name = "heights"
git = "https://github.com/lana-agents/heights.git"
rev = "3539e2a12dd3470c057a4eb531dc3fd627d4c97b"

# The étale fundamental group of a scheme (`AlgebraicGeometry.FiniteEtale.galoisCategory`,
# `AlgebraicGeometry.FiniteEtale.fiber`): the algebraic side of the comparison theorem in
# `Oka/Analytification/Pi1/`, and the Reidemeister–Schreier / surface-group results used in
# `Oka/Topology/Covering/`. Pinned at pi1 master (1f01e28, which has
# `Pi1.ReidemeisterSchreier.exists_quotient_sup_mulEquiv_surfaceGroup_zero`).
[[require]]
name = "pi1"
git = "https://github.com/lana-agents/pi1"
rev = "1f01e28501d2a0a5fd6851ac26f25fd0c7783cdd"
