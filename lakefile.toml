name = "oka"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Oka", "OkaTest"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Oka"

# Regression tests. Kept out of the `Oka` library so that they are not imported by downstream
# users, but built by `lake build` so that CI runs them.
[[lean_lib]]
name = "OkaTest"
globs = ["OkaTest.+"]
