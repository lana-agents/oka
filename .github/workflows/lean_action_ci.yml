# The checks here mirror `.orchestra/validation.sh`, which is what an agent runs before opening
# a pull request; keep the two in step. What "lint" means is defined once, as `lintDriver` in
# `lakefile.toml`, so at least that cannot drift.
name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # A `sorry` is only a warning to Lean, so a bare `lake build` would not fail on one. The
      # build below passes `--wfail`, which does — measured 2026-08-20 by planting one under
      # `OkaTest/`. That is why this grep, which covers `Oka Oka.lean` only, is a fast fail
      # before the slow build rather than the only defence: `OkaTest/` is guarded by `--wfail`.
      #
      # `--wfail` was added on 2026-08-20 and had never been passed here before, so until then
      # every build linter in `weak.linter.mathlibStandardSet` — `sorry`, line length,
      # copyright headers, `linter.style.show` — was enforced by `.orchestra/validation.sh`
      # locally and by nothing in CI.
      #
      # The negative lookarounds keep prose containing the word "sorry" from matching.
      - name: Check for sorry
        run: |
          if grep -rnP '(?<![A-Za-z_])sorry(?![A-Za-z_])' --include='*.lean' Oka Oka.lean; then
            echo "::error::found a sorry in the library"
            exit 1
          fi

      # `README.md`'s `### Checking` section is this repository's index of `scripts/`, and until
      # 2026-08-24 three of the six entries there — `check_docstring_names.py`, which
      # `validation.sh` runs, `DumpEnvNames.lean`, which feeds it, and
      # `docstring-names-ignore.txt` — were named nowhere in it. This asks the same question as
      # Mathlib's `undocumentedScripts` linter, which `lake exe lint-style` gates off by default
      # and which reads `scripts/README.md`, a file this repository deliberately does not have;
      # pointing it at the index that exists is what makes it worth running. It is not the same
      # *test*: Mathlib matches the name wrapped in backticks, which three of the six entries
      # here are not written in. It secures one thing only: a file under `scripts/` that nobody
      # has written a sentence about.
      # `.orchestra/validation.sh` carries the full reasoning and the three choices in the rule.
      #
      # The match is a whole token, not a substring: `README.md` is split into maximal runs of
      # `[A-Za-z0-9_.-]` — the filename alphabet — and the name has to equal one of them. As a
      # substring search, one entry's name could be satisfied by another entry's, so a new
      # `scripts/cost.py` passed on the strength of the sentence about `import_cost.py`. The
      # fallback for a name outside that alphabet, and the reason a shadowing-pair check was not
      # the answer, are in the comment on the same loop in `.orchestra/validation.sh`.
      - name: Check every file under scripts is named in README.md
        run: |
          undocumented=""
          readme_tokens="$(tr -c 'A-Za-z0-9_.-' '\n' < README.md)"
          for f in scripts/*; do
            name="$(basename "$f")"
            case "$name" in
              *[!A-Za-z0-9_.-]*) grep -qF -- "$name" README.md ;;
              *) grep -qxF -- "$name" <<< "$readme_tokens" ;;
            esac || undocumented="$undocumented $name"
          done
          if [ -n "$undocumented" ]; then
            echo "::error::not named in README.md:$undocumented"
            exit 1
          fi

      # Builds the `Oka` library and the `OkaTest` library, whose `OkaTest/Axioms.lean` asserts
      # that the main theorems depend only on `propext`, `Classical.choice` and `Quot.sound`.
      #
      # `lint: true` makes the action run `lake lint` after the build, which the `lintDriver` in
      # `lakefile.toml` resolves to the environment linters over `Oka`. Without that
      # setting the action's default is to skip linting silently, which is worse than not having
      # the step: look for `Linting passed for Oka` in this step's log, not merely for a green
      # tick.
      #
      # `build-args: --wfail` turns Lean's warnings into build errors, which is what makes the
      # build linters of `weak.linter.mathlibStandardSet` (line length, copyright headers,
      # `linter.style.show`, `declaration uses 'sorry'`) a merge gate rather than advice.
      # `.orchestra/validation.sh` has always run `lake build --wfail`; this step had not, and
      # the divergence was invisible because both are spelled "the build". The action passes
      # this input through verbatim: `scripts/lake_build.sh` is `eval "lake build $BUILD_ARGS"`,
      # and with the input unset a CI log shows `BUILD_ARGS:` empty.
      - uses: leanprover/lean-action@v1
        with:
          lint: true
          build-args: --wfail

      # Both library root modules must import every file of their library. `Oka.lean` is
      # maintained by hand-free regeneration (`lake exe mk_all --git`); `OkaTest.lean` exists so
      # that `lake exe lint-style` can be pointed at the test library at all, and this check is
      # what stops it from silently going stale — every `OkaTest.+` module is its own build
      # target, so a new test file missing from the root still builds and just drops out of
      # `lint-style`'s reach.
      #
      # `.orchestra/validation.sh` has run the `Oka` half since it was written and neither half
      # was here; the script's header says the two must be kept in step, so both are here now.
      #
      # `!cancelled()` for the same reason as the style step below.
      - name: Check root modules are complete
        if: ${{ !cancelled() }}
        run: |
          lake exe mk_all --lib Oka --git --check
          lake exe mk_all --lib OkaTest --git --check

      # Mathlib's text-based style linter, a separate executable from the environment linters
      # and not covered by `lake lint`. It checks *less* than its name suggests. Seven checks
      # run: Windows line endings, trailing whitespace, a space before a semicolon, disallowed
      # unicode and variant selectors, the string "Adaptation note", module-name casing, and
      # filenames forbidden on Windows or on Nix. Line length and copyright headers are *build*
      # linters, which this project gets from `weak.linter.mathlibStandardSet` plus `--wfail`,
      # so a green tick here does not mean "Mathlib style has been checked".
      # `elan` and the build cache are left in place by the step above, so this only has to link
      # the executable.
      #
      # Three further sub-checks are gated off by default and none can simply be switched on
      # here; one of the three is the reason this repository has no `scripts/README.md`. The
      # measurements and that decision are in the comment on the same command in
      # `.orchestra/validation.sh`, for the reason given below: the two files must agree about
      # what is *run*, and duplicating the argument is how they come to disagree about it.
      #
      # Both library root modules. `OkaTest` was absent here until 2026-08-20, not by choice
      # but because `lint-style Oka OkaTest` failed with `no such file OkaTest.lean` — the test
      # library had no root module — so half the tree was text-linted by nothing. `OkaTest.lean`
      # now exists and the step above keeps it in step with the files on disk.
      #
      # This step's log always carries `warning: nolints file could not be read; treating as
      # empty: scripts/nolints-style.txt`, and that file is **deliberately absent**. Read the
      # comment on the same command in `.orchestra/validation.sh` for the argument; the short
      # version is that every finding this linter can report is a mechanical defect in one of our
      # files, all of them fixable, so the file has nothing legitimate to hold and creating it
      # would only add a way to suppress a finding instead of fixing it. The reasoning lives in
      # one place on purpose — the two files must agree about what is *run*, and duplicating
      # twenty lines of argument in both is how they come to disagree about what it means.
      #
      # `!cancelled()` so that a failure of the step above does not hide a style error. Without
      # it GitHub marks this step `skipped`, and since an agent gets one CI run per push that
      # turns two findings into two round trips. It is text-based and does not need the library
      # to have built.
      - name: Check style
        if: ${{ !cancelled() }}
        run: lake exe lint-style Oka OkaTest

      # Every backticked dotted name in a comment or docstring must resolve to a declaration, a
      # module, a file in the repository, or field notation on one of those. Nothing else in
      # this workflow looks inside a comment: the build sees only elaborated terms, `lake lint`
      # checks declaration *names*, and the step above checks whitespace and unicode. See
      # `scripts/check_docstring_names.py` for the rules and for what a green here does not mean.
      #
      # This reads the environment with `lake env lean`, so it needs the build above to have
      # produced the oleans — hence no `!cancelled()` here, unlike the two steps above, which
      # are text-based and do not.
      - name: Check names in docstrings
        run: python3 scripts/check_docstring_names.py

      # Every `.lean` file under `Oka/` and `OkaTest/` must have a module docstring with a
      # non-empty body. The step above checks the names *inside* a docstring, so on an empty one
      # it finds nothing to check and passes, and an empty `/-! -/` elaborates, so the build does
      # not see it either. Seven files under `Oka/` carried one from the second commit in the
      # repository until 2026-08-23 and every check in this workflow was green on all seven.
      #
      # Text only — no build and no oleans — hence `!cancelled()`, so that a failure of the build
      # does not hide an empty docstring and turn two findings into two round trips.
      - name: Check module docstrings are non-empty
        if: ${{ !cancelled() }}
        run: python3 scripts/check_module_docstrings.py
